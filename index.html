<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Adventure - Optimized</title>
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- 1. 変数の宣言（外に出しておく） ---
        let playerMesh, mixer;
        const clock = new THREE.Clock();
        const move = { x: 0, z: 0 };
        const keys = {};

        // --- 2. 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4ff);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 20, 30);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 3. 物理世界 ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x8bc34a })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // プレイヤー物理体（半径0.5の球体）
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(0.5) 
        });
        playerBody.position.set(0, 5, 0);
        world.addBody(playerBody);

        // --- 4. モデル読み込み（animateの外で1回だけ！） ---
        const loader = new GLTFLoader();
        loader.load('first_kemono_animation.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.traverse(n => { if(n.isMesh) n.castShadow = true; });
            scene.add(playerMesh);
        
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerMesh);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }
        });

        // --- 5. 操作系 ---
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'dynamic',
            color: 'white'
        });
        manager.on('move', (evt, data) => {
            move.x = data.vector.x;
            move.z = data.vector.y;
        });
        manager.on('end', () => { move.x = 0; move.z = 0; });

        // --- 6. 更新ループ ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            world.fixedStep();

            // キーボード入力
            let kX = 0, kZ = 0;
            if (keys['ArrowUp'] || keys['KeyW']) kZ = 1;
            if (keys['ArrowDown'] || keys['KeyS']) kZ = -1;
            if (keys['ArrowLeft'] || keys['KeyA']) kX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) kX = 1;

            const finalX = move.x || kX;
            const finalZ = move.z || kZ;

            const speed = 5;
            playerBody.velocity.x = finalX * speed;
            playerBody.velocity.z = -finalZ * speed;

            if (playerMesh) {
                // 物理体に追従
                playerMesh.position.copy(playerBody.position);
                
                // ★めり込み調整
                // 物理球体の中心は y=0.5 (半径分) なので、-0.5すると足元が y=0 になります。
                // Blenderで原点を足元にしたなら、ここを -0.5 前後で調整してください。
                playerMesh.position.y -= 0.5; 

                // 向きの調整
                if (Math.abs(finalX) > 0.1 || Math.abs(finalZ) > 0.1) {
                    playerMesh.rotation.y = Math.atan2(finalX, finalZ) + Math.PI / 2; 
                }

                // カメラ追従
                const targetPos = playerMesh.position;
                const offset = new THREE.Vector3(10, 20, 30);
                camera.position.lerp(targetPos.clone().add(offset), 0.1);
                controls.target.copy(targetPos);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
