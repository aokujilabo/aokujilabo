<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>aokujilabo</title>
    <link rel="icon" href="./favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="./favicon.png">
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        #check-btn {
            display: none;
            position: absolute;
            padding: 10px 20px;
            background: #ff9800;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
            user-select: none; /* テキスト選択防止 */
        }
    
        #balloon {
            display: none;
            position: absolute;
            /* 看板の板をイメージしたデザイン */
            background: #f4e4bc; /* 古びた紙・木のような色 */
            color: #4e342e;    /* 濃い茶色の文字 */
            padding: 20px;
            border-radius: 4px; /* 角を少しだけ丸める */
            border: 6px solid #5d4037; /* 太めの木の枠線 */
            
            /* 看板っぽさを出す装飾 */
            padding: 30px;            /* 余白を広げてゆったりさせる */
            width: 400px;             /* 250px から 400px に大幅アップ */
            min-height: 150px;        /* 最小の高さも少し確保 */
            font-size: 1.5rem;        /* 文字も一回り大きく（1.2〜1.5くらいがおすすめ） */
            line-height: 1.6;         /* 行間を広げると読みやすくなります */
            
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.1);

            transform: rotate(-1deg);            
            z-index: 101;
            pointer-events: auto; /* リンクをクリックできるように */
        }

        /* 吹き出しの「しっぽ（三角）」を消して、より看板らしく */
        #balloon::after {
            content: none;
        }
    </style>
</head>
<body>
    <button id="check-btn">◆</button>
    <div id="balloon">
        <p id="balloon-text" style="margin:0;"></p>
        <a id="balloon-link" href="#" target="_blank" style="display:none; color:#007bff; text-decoration:underline; margin-top:10px; display:inline-block;">◇</a>
    </div>
    
    <div id="joystick-zone"></div>    

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- 1. 変数宣言 ---
        let playerMesh = null, mixer = null;
        let isZooming = false;
        let signMesh = null;
        const clock = new THREE.Clock();
        const move = { x: 0, z: 0 };
        const keys = {};

        // 看板のデータリスト
        const signData = [
            { x: 40, z: 0, rot: -Math.PI / 2, msg: "東の看板：海が見えるよ<br>ﾅﾝﾁｬｯﾃ" }, // 左を向く
            { x: -40, z: 0, rot: Math.PI / 2, msg: "西の看板：森が広がっている<br>とうれしいな" }, // 右を向く
            { x: 0, z: 40, rot: Math.PI, msg: "南の看板：太陽がまぶしい<br>わけもなく" }, // そのまま（南向き）
            { x: 0, z: -40, rot: 0, msg: "北の看板：こっちは寒いぞ<br>気を付けろ" }, // 180度回転
            { x: -10, z: -10, rot: 0, msg: "IRIAMのりんく<br>ウクレレ弾いてるよ", url: "https://web.iriam.app/s/user/7iqMoj5s8y?uuid=40876107" }, // 180度回転
            { x: 0, z: -10, rot: 0, msg: "ツイッターのりんく<br>落書きのせたりしてるよ", url: "https://x.com/aokujira_iriam" }, // 180度回転
            { x: 10, z: -10, rot: 0, msg: "なかみはない<br>からっぽの看板のようだ" } // 180度回転
        ];
        
        // メッセージを表示するHTML要素（まだ作っていなければ）
        const msgBox = document.createElement('div');
        msgBox.style.cssText = "position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:15px; border-radius:10px; display:none; font-family:sans-serif; z-index:100; pointer-events:none;";
        document.body.appendChild(msgBox);

        let activeSign = null; 
        const checkBtn = document.getElementById('check-btn');
        const balloon = document.getElementById('balloon');

        // --- 2. Three.js 設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4ff);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 20, 30);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = false; // [CHECK]

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 3. 物理世界 ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // 床
        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.MeshStandardMaterial({ color: 0x8bc34a })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // プレイヤー物理体
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(0.5) 
        });
        playerBody.position.set(0, 5, 0);
        playerBody.fixedRotation = true; // ★これを追加！
        world.addBody(playerBody);

        // --- 4. 看板の物理体 (ぶつかって止まる壁) ---
        // サイズ: 幅1m, 高さ2m, 厚み0.4m の箱
        const signShape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.2)); 
        const signBody = new CANNON.Body({ mass: 0 }); // mass:0 で固定される
        signBody.addShape(signShape);
        signBody.position.set(5, 1, 5); // 後で読み込むモデルと同じ位置に
        world.addBody(signBody);

        // --- 5. モデル読み込み ---
        const loader = new GLTFLoader();

        // キャラクター読み込み
        let actions = {}; // アニメーションを保存する辞書
        let currentAction; // 現在再生中のアクション
        
        loader.load('first_kemono_animation.glb', (gltf) => {
            playerMesh = gltf.scene;
            scene.add(playerMesh);
            
            mixer = new THREE.AnimationMixer(playerMesh);
            
            // 全てのアニメーションを登録（名前はBlenderでの設定に合わせてください）
            gltf.animations.forEach((clip) => {
                actions[clip.name] = mixer.clipAction(clip);
            });
        
            // 最初は Idle を再生
            currentAction = actions['Idle'] || actions[Object.keys(actions)[0]]; 
            if (currentAction) currentAction.play();
        });

        // 看板読み込み
        loader.load('signboard.glb', (gltf) => {
            signData.forEach((data) => {
                // 1. 3Dモデルを表示
                const mesh = gltf.scene.clone(); 
                mesh.position.set(data.x, 0, data.z); 
                mesh.rotation.y = data.rot; 
                scene.add(mesh);
                data.mesh = mesh;
                mesh.traverse(n => { if(n.isMesh) n.castShadow = true; });

                // 2. ★物理的な「壁」をこの看板の位置にも作る
                const sBody = new CANNON.Body({ mass: 0 });
                sBody.addShape(new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.2))); 
                sBody.position.set(data.x, 1, data.z);
                sBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), data.rot); // 向きも合わせる
                world.addBody(sBody);
            });
        });

        // --- 6. 操作 ＆ 更新 ---
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'dynamic', color: 'white' });
        manager.on('move', (evt, data) => { move.x = data.vector.x; move.z = data.vector.y; });
        manager.on('end', () => { move.x = 0; move.z = 0; });

        // 看板チェックの挙動.
        checkBtn.onclick = () => {
            if (activeSign) {
                isZooming = true;
                if (playerMesh) playerMesh.visible = false; // キャラを消す

                // --- 1. テキスト反映 ---
                document.getElementById('balloon-text').innerHTML = activeSign.msg;
                
                // リンク（url）がある場合だけリンクを表示する---
                const linkTag = document.getElementById('balloon-link');
                if (activeSign.url) {
                    linkTag.href = activeSign.url;
                    linkTag.style.display = 'inline-block';
                } else {
                    linkTag.style.display = 'none';
                }
                
                // --- 2. ズーム位置の計算（高さをしっかり確保！） ---
                const zoomPos = activeSign.mesh.position.clone();
                const dist = 5;      // 看板からの距離
                zoomPos.y += 4.5; 
                const offsetY = 1.5; // ★カメラの高さ（看板の中央に合わせる）

                // 看板の向き(rot)に合わせて、手前の位置を計算
                zoomPos.x += Math.sin(activeSign.rot) * dist;
                zoomPos.z += Math.cos(activeSign.rot) * dist;
                zoomPos.y += offsetY; // ★ここで高さを足す！

                // 3. カメラをそこに移動
                camera.position.copy(zoomPos);
                
                // 4. 注視点も看板の中央（高さ1.2m）にする
                const targetPos = activeSign.mesh.position.clone();
                targetPos.y += offsetY; // ★注視点の高さも合わせる
                controls.target.copy(targetPos);
                
                // --- 5. 【重要】OrbitControlsの角度をリセット ---
                controls.update(); // ★今の設定を一度反映させてから...

                // カメラの角度（俯瞰）を真横（水平）にする
                // 水平角度（polarAngle）を Math.PI / 2 （90度）に強制固定
                camera.lookAt(targetPos); 
                // controls.update(); // OrbitControlsを使うなら、ここでもう一度呼ぶ

                balloon.style.display = 'block';
                checkBtn.style.display = 'none';
            }
        };
        
        // 吹き出しをクリックしたら閉じる
        balloon.onclick = () => {
            balloon.style.display = 'none';
            if (playerMesh) playerMesh.visible = true; // キャラを戻す
            isZooming = false; // ここでズーム終了！
        };

        // --- 7. 関数 ---
        // アニメーションを切り替える関数
        function fadeToAction(name, duration = 0.2) {
            const nextAction = actions[name];
            if (nextAction && currentAction !== nextAction) {
                nextAction.reset();
                nextAction.play();
                currentAction.crossFadeTo(nextAction, duration, true);
                currentAction = nextAction;
            }
        }
        
        // UIポジションのアップデート
        function updateUIPosition(mesh, element, offsetY = 2) {
            if (!mesh) return;
        
            // メッシュの世界座標を取得
            const vector = new THREE.Vector3();
            mesh.getWorldPosition(vector);
            vector.y = offsetY; // 看板の少し上に表示
        
            // 3D座標を画面上の-1〜1の範囲に投影
            vector.project(camera);
        
            // 画面サイズに合わせてピクセル座標に変換
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
        
            // 要素の位置を更新
            element.style.left = `${x}px`;
            element.style.top = `${y}px`;
            element.style.transform = 'translate(-50%, -100%)';
        }

        // animation管理
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // --- 1. 入力を受け取る ---
            let kX = 0, kZ = 0;
            if (keys['ArrowUp'] || keys['KeyW']) kZ = 1;
            if (keys['ArrowDown'] || keys['KeyS']) kZ = -1;
            if (keys['ArrowLeft'] || keys['KeyA']) kX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) kX = 1;

            const finalX = (move.x || kX); 
            const finalZ = (move.z || kZ);
            
            // inputX, inputZ を使って計算します
            const inputX = move.x || (keys['ArrowRight'] || keys['KeyD'] ? 1 : keys['ArrowLeft'] || keys['KeyA'] ? -1 : 0);
            const inputZ = move.z || (keys['ArrowUp'] || keys['KeyW'] ? 1 : keys['ArrowDown'] || keys['KeyS'] ? -1 : 0);
            const isMoving = Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1;
            const speed = 10;
            
            // --- 2. 物理体に速度を与える ---
            if (!isZooming) { // ★ズーム中でない時だけ動かせるように
                playerBody.velocity.x = finalX * speed;
                playerBody.velocity.z = -finalZ * speed;
            } else {
                playerBody.velocity.set(0, 0, 0); // ズーム中はピタッと止める
            }

            // --- 3. ここで物理計算を進める！ (速度を与えた直後) ---
            world.step(1/60, delta, 10);
            
            // --- 4. メッシュとカメラの更新 ---
            // プレイヤーの移動処理
            if (playerMesh) {
                // 1. 物理体との同期
                playerMesh.position.copy(playerBody.position);
                playerMesh.position.y -= 0.5; // めり込み微調整
            
                // 2. 向きの修正（左で下、下で左…を直す決定版）
                // 入力の有無を確認（0.1以上の入力があれば「移動中」とみなす）
                if (isMoving && !isZooming) {
                    playerMesh.rotation.y = Math.atan2(-inputX, inputZ) + Math.PI;
                    fadeToAction('walk');
                } else {
                    fadeToAction('idle');
                }
            
                // 3. カメラの追従（ガクガク防止版）
                // 【重要】lerpをやめて、直接位置を計算する
                // 【重要】ズーム中でない時だけ、カメラをプレイヤーに追従させる
                if (!isZooming) {
                    const idealOffset = new THREE.Vector3(10, 20, 30);
                    const targetPos = playerMesh.position.clone().add(idealOffset);
                    
                    // 滑らかさを捨てて「完全同期」させる
                    camera.position.copy(targetPos); 
                    controls.target.copy(playerMesh.position);
                        
                    // ぬるっと戻したいなら lerp、パッと戻したいなら copy
                    // camera.position.lerp(targetPos, 0.1); 
                    // controls.target.lerp(playerMesh.position, 0.1);
                }
            }
            
            // --- 5. 描画直前にコントロール更新 ---
            controls.update();
            renderer.render(scene, camera);

            // --- 6. 距離判定 (描画の後でもOK) ---
            let nearAnySign = false;
            // 看板との距離チェック
            signData.forEach((data) => {
                if (data.mesh && playerMesh) {
                    const dist = playerMesh.position.distanceTo(data.mesh.position);
                    
                    if (dist < 3) { // 近づいた！
                        nearAnySign = true;
                        activeSign = data;
                        
                        // ボタンや吹き出しの位置を「今」の座標に更新
                        // ボタン表示
                        if (balloon.style.display !== 'block') {
                            checkBtn.style.display = 'block';
                            updateUIPosition(data.mesh, checkBtn, 2.5);
                        }
                        // 看板内容表示
                        if (isZooming) {
                            // ズーム中は看板のちょうど真ん中（高さ1.5m付近）に表示
                            updateUIPosition(activeSign.mesh, balloon, 1.8);
                        } else {
                            // 通常時は看板の少し上
                            updateUIPosition(activeSign.mesh, balloon, 2.5);
                        }
                    }
                }
            });
        
            // 離れたら消す
            if (!nearAnySign) {
                checkBtn.style.display = 'none';
                balloon.style.display = 'none';
                activeSign = null;
                isZooming = false; // ズーム解除
                if (playerMesh) playerMesh.visible = true; // [追加] 離れたら必ず表示
            }
        }
        animate();
    </script>
</body>
</html>
