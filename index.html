<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Adventure - Signboard Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- 1. 変数宣言 ---
        let playerMesh = null, mixer = null;
        let signMesh = null;
        const clock = new THREE.Clock();
        const move = { x: 0, z: 0 };
        const keys = {};

        // --- 2. Three.js 設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4ff);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 20, 30);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 3. 物理世界 ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // 床
        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x8bc34a })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // プレイヤー物理体
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(0.5) 
        });
        playerBody.position.set(0, 5, 0);
        world.addBody(playerBody);

        // --- 4. 看板の物理体 (ぶつかって止まる壁) ---
        // サイズ: 幅1m, 高さ2m, 厚み0.4m の箱
        const signShape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.2)); 
        const signBody = new CANNON.Body({ mass: 0 }); // mass:0 で固定される
        signBody.addShape(signShape);
        signBody.position.set(5, 1, 5); // 後で読み込むモデルと同じ位置に
        world.addBody(signBody);

        // --- 5. モデル読み込み ---
        const loader = new GLTFLoader();

        // キャラクター読み込み
        loader.load('first_kemono_animation.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            scene.add(playerMesh);
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerMesh);
                mixer.clipAction(gltf.animations[0]).play();
            }
        });

        // 看板読み込み
        loader.load('signboard.glb', (gltf) => {
            signMesh = gltf.scene;
            signMesh.position.copy(signBody.position);
            // モデルの原点が足元なら -1 (高さの半分) して物理の箱と合わせる
            signMesh.position.y -= 1; 
            signMesh.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            scene.add(signMesh);
        });

        // --- 看板の物理設定 ---
        /*
        // Boxの数値は「中心からの距離」なので、(0.5, 1, 0.2) は「幅1m, 高さ2m, 厚み0.4m」になります
        const signShape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.2)); 
        const signBody = new CANNON.Body({
            mass: 0, // 0にすると何がぶつかっても動かない「不動の壁」になります
            shape: signShape
        });
        signBody.position.set(5, 1, 5); // 看板を置きたい座標
        world.addBody(signBody);
        
        // --- 看板の見た目（モデル）を重ねる ---
        loader.load('signboard.glb', (gltf) => {
            signMesh = gltf.scene;
            scene.add(signMesh);
            
            // 物理の箱の位置をモデルにコピー
            signMesh.position.copy(signBody.position);
            // もしモデルの原点が足元なら、高さの半分(1)だけ下げるとピッタリ重なります
            signMesh.position.y -= 1; 
        });
        */
        // --- ここまで　コリジョン ---

        // --- 6. 操作 ＆ 更新 ---
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'dynamic', color: 'white' });
        manager.on('move', (evt, data) => { move.x = data.vector.x; move.z = data.vector.y; });
        manager.on('end', () => { move.x = 0; move.z = 0; });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            world.fixedStep();

            let kX = 0, kZ = 0;
            if (keys['ArrowUp'] || keys['KeyW']) kZ = 1;
            if (keys['ArrowDown'] || keys['KeyS']) kZ = -1;
            if (keys['ArrowLeft'] || keys['KeyA']) kX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) kX = 1;

            const finalX = move.x || kX;
            const finalZ = move.z || kZ;

            playerBody.velocity.x = finalX * 5;
            playerBody.velocity.z = -finalZ * 5;

            if (playerMesh) {
                playerMesh.position.copy(playerBody.position);
                playerMesh.position.y -= 0.5; // めり込み微調整
                if (Math.abs(finalX) > 0.1 || Math.abs(finalZ) > 0.1) {
                    // 下記の「+ Math.PI」の部分を、
                    // なし / + Math.PI / 2 / - Math.PI / 2 / + Math.PI 
                    // のどれかにすれば必ず正解に当たります。今の症状なら「+ Math.PI」が怪しいです。
                    playerMesh.rotation.y = Math.atan2(inputX, inputZ) + Math.PI;
                }
                camera.position.lerp(playerMesh.position.clone().add(new THREE.Vector3(10, 20, 30)), 0.1);
                controls.target.copy(playerMesh.position);
            }
            controls.update();
            renderer.render(scene, camera);

            // [DEBUG]物理体の位置に、Three.jsの赤い箱を表示させる
            if (playerMesh && signMesh) {
                const distance = playerMesh.position.distanceTo(signMesh.position);
                if (distance < 2) {
                    // ここに「しらべる」ボタンを出す処理を書く
                    console.log("看板の近くにいます！");
                }
            }
        }
        animate();
    </script>
</body>
</html>
