<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Adventure - Signboard Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        #check-btn {
            display: none;
            position: absolute;
            padding: 10px 20px;
            background: #ff9800;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
            user-select: none; /* テキスト選択防止 */
        }
    
        #balloon {
            display: none;
            position: absolute;
            background: white;
            padding: 15px;
            border-radius: 15px;
            border: 3px solid #333;
            width: 200px;
            z-index: 101;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <button id="check-btn">◆</button>
    <div id="balloon"><p id="balloon-text"></p></div>
    
    <div id="joystick-zone"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- 1. 変数宣言 ---
        let playerMesh = null, mixer = null;
        let signMesh = null;
        const clock = new THREE.Clock();
        const move = { x: 0, z: 0 };
        const keys = {};

        // 看板のデータリスト
        const signData = [
            { x: 10, z: 0, rot: -Math.PI / 2, msg: "東の看板：海が見えるよ" }, // 左を向く
            { x: -10, z: 0, rot: Math.PI / 2, msg: "西の看板：森が広がっている" }, // 右を向く
            { x: 0, z: 10, rot: 0, msg: "南の看板：太陽がまぶしい" }, // そのまま（南向き）
            { x: 0, z: -10, rot: Math.PI, msg: "北の看板：こっちは寒いぞ" } // 180度回転
        ];
        
        // メッセージを表示するHTML要素（まだ作っていなければ）
        const msgBox = document.createElement('div');
        msgBox.style.cssText = "position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:15px; border-radius:10px; display:none; font-family:sans-serif; z-index:100; pointer-events:none;";
        document.body.appendChild(msgBox);

        let activeSign = null; 
        const checkBtn = document.getElementById('check-btn');
        const balloon = document.getElementById('balloon');

        // --- 2. Three.js 設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4ff);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 20, 30);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 3. 物理世界 ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // 床
        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x8bc34a })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // プレイヤー物理体
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(0.5) 
        });
        playerBody.position.set(0, 5, 0);
        world.addBody(playerBody);

        // --- 4. 看板の物理体 (ぶつかって止まる壁) ---
        // サイズ: 幅1m, 高さ2m, 厚み0.4m の箱
        const signShape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.2)); 
        const signBody = new CANNON.Body({ mass: 0 }); // mass:0 で固定される
        signBody.addShape(signShape);
        signBody.position.set(5, 1, 5); // 後で読み込むモデルと同じ位置に
        world.addBody(signBody);

        // --- 5. モデル読み込み ---
        const loader = new GLTFLoader();

        // キャラクター読み込み
        let actions = {}; // アニメーションを保存する辞書
        let currentAction; // 現在再生中のアクション
        
        loader.load('first_kemono_animation.glb', (gltf) => {
            playerMesh = gltf.scene;
            scene.add(playerMesh);
            
            mixer = new THREE.AnimationMixer(playerMesh);
            
            // 全てのアニメーションを登録（名前はBlenderでの設定に合わせてください）
            gltf.animations.forEach((clip) => {
                actions[clip.name] = mixer.clipAction(clip);
            });
        
            // 最初は Idle を再生
            currentAction = actions['Idle'] || actions[Object.keys(actions)[0]]; 
            if (currentAction) currentAction.play();
        });

        // 看板読み込み
        loader.load('signboard.glb', (gltf) => {
            loader.load('signboard.glb', (gltf) => {
                signData.forEach((data) => {
                    // モデルを複製
                    const mesh = gltf.scene.clone(); 
                    
                    // 位置をセット
                    mesh.position.set(data.x, 0, data.z); 
                    
                    // ★ ここで向き（回転）をセット！
                    mesh.rotation.y = data.rot; 
                    
                    scene.add(mesh);
                    data.mesh = mesh; // 距離判定用に保存
                    
                    // 影の設定
                    mesh.traverse(n => { if(n.isMesh) n.castShadow = true; });
                });
            });
        });

        // --- 6. 操作 ＆ 更新 ---
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'dynamic', color: 'white' });
        manager.on('move', (evt, data) => { move.x = data.vector.x; move.z = data.vector.y; });
        manager.on('end', () => { move.x = 0; move.z = 0; });
        checkBtn.onclick = () => {
            if (activeSign) {
                document.getElementById('balloon-text').innerText = activeSign.msg;
                balloon.style.display = 'block';
                checkBtn.style.display = 'none';
            }
        };
        
        // 吹き出しをクリックしたら閉じる
        balloon.onclick = () => {
            balloon.style.display = 'none';
        };

        // --- 7. 関数 ---
        // アニメーションを切り替える関数
        function fadeToAction(name, duration = 0.2) {
            const nextAction = actions[name];
            if (nextAction && currentAction !== nextAction) {
                nextAction.reset();
                nextAction.play();
                currentAction.crossFadeTo(nextAction, duration, true);
                currentAction = nextAction;
            }
        }
        
        // UIポジションのアップデート
        function updateUIPosition(mesh, element, offsetY = 2) {
            if (!mesh) return;
        
            // メッシュの世界座標を取得
            const vector = new THREE.Vector3();
            mesh.getWorldPosition(vector);
            vector.y += offsetY; // 看板の少し上に表示
        
            // 3D座標を画面上の-1〜1の範囲に投影
            vector.project(camera);
        
            // 画面サイズに合わせてピクセル座標に変換
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
        
            // 要素の位置を更新
            element.style.left = `${x}px`;
            element.style.top = `${y}px`;
            element.style.transform = 'translate(-50%, -100%)';
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            world.fixedStep();

            let kX = 0, kZ = 0;
            if (keys['ArrowUp'] || keys['KeyW']) kZ = 1;
            if (keys['ArrowDown'] || keys['KeyS']) kZ = -1;
            if (keys['ArrowLeft'] || keys['KeyA']) kX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) kX = 1;

            const finalX = (move.x || kX); 
            const finalZ = (move.z || kZ);
            
            // inputX, inputZ を使って計算します
            const inputX = move.x || (keys['ArrowRight'] || keys['KeyD'] ? 1 : keys['ArrowLeft'] || keys['KeyA'] ? -1 : 0);
            const inputZ = move.z || (keys['ArrowUp'] || keys['KeyW'] ? 1 : keys['ArrowDown'] || keys['KeyS'] ? -1 : 0);
            const isMoving = Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1;

            playerBody.velocity.x = finalX * 5;
            playerBody.velocity.z = -finalZ * 5;

            // プレイヤーの移動処理
            if (playerMesh) {
                // 1. 物理体との同期
                playerMesh.position.copy(playerBody.position);
                playerMesh.position.y -= 0.5; // めり込み微調整
            
                // 2. 向きの修正（左で下、下で左…を直す決定版）

                // 入力の有無を確認（0.1以上の入力があれば「移動中」とみなす）
                if (isMoving) {
                    playerMesh.rotation.y = Math.atan2(-inputX, inputZ) + Math.PI;
                    fadeToAction('walk');
                } else {
                    fadeToAction('idle');
                }
            
                // 3. カメラの追従（ガクガク防止版）
                const idealOffset = new THREE.Vector3(10, 20, 30);
                const targetPos = playerMesh.position.clone().add(idealOffset);
                
                // カメラ位置を滑らかに
                camera.position.lerp(targetPos, 0.1);
                // カメラの注視点（ターゲット）も滑らかに追従させることでガクガクを消す
                controls.target.lerp(playerMesh.position, 0.1); 
            }
            
            controls.update();
            renderer.render(scene, camera);

            
            let nearAnySign = false;
            // 看板との距離チェック
            signData.forEach((data) => {
                if (data.mesh && playerMesh) {
                    const dist = playerMesh.position.distanceTo(data.mesh.position);
                    
                    if (dist < 3) { // 近づいた！
                        nearAnySign = true;
                        activeSign = data;
                        
                        // ボタンや吹き出しの位置を「今」の座標に更新
                        if (balloon.style.display !== 'block') {
                            checkBtn.style.display = 'block';
                            updateUIPosition(data.mesh, checkBtn, 2.5);
                        } else {
                            updateUIPosition(data.mesh, balloon, 3.0);
                        }
                    }
                }
            });
        
            // 離れたら消す
            if (!nearAnySign) {
                checkBtn.style.display = 'none';
                balloon.style.display = 'none';
                activeSign = null;
            }
            
        }
        animate();
    </script>
</body>
</html>
