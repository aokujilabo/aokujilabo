<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Adventure Base</title>
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        #joystick-container { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; }
    </style>
</head>
<body>
    <div id="joystick-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- 1. 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaad4ff);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);

        // マウスホイール・ドラッグでカメラ制御
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 2. 物理世界 (Cannon.js) ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // 床（物理）
        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        // 床（見た目）
        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x8bc34a })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // キャラクター用の物理体 (球体やカプセルが理想)
        const playerBody = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(0.5) // キャラを半径0.5の球体として扱う
        });
        playerBody.position.set(0, 5, 0); // 空中からスタート
        world.addBody(playerBody);

        // --- 3. モデル読み込み ---
        const loader = new GLTFLoader();
        let playerMesh, signMesh;

        loader.load('first_kemono_animation.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.traverse(n => { if(n.isMesh) n.castShadow = true; });
            scene.add(playerMesh);
        });

        loader.load('signboard.glb', (gltf) => {
            signMesh = gltf.scene;
            signMesh.position.set(5, 0, 5);
            signMesh.traverse(n => { if(n.isMesh) n.castShadow = true; });
            scene.add(signMesh);
        });

        // --- 4. 操作系 (ジョイスティック & キーボード) ---
        const move = { forward: 0, right: 0 };
        const keys = {};

        // キーボード
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // ジョイスティック
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-container'),
            mode: 'static',
            position: { left: '60px', bottom: '60px' },
            color: 'white'
        });
        joystick.on('move', (evt, data) => {
            const forward = data.vector.y;
            const right = data.vector.x;
            move.forward = forward;
            move.right = right;
        });
        joystick.on('end', () => { move.forward = 0; move.right = 0; });

        // --- 5. 更新ループ ---
        function animate() {
            requestAnimationFrame(animate);
            world.fixedStep();

            // キーボード入力の反映
            let kF = 0, kR = 0;
            if(keys['ArrowUp'] || keys['KeyW']) kF = 1;
            if(keys['ArrowDown'] || keys['KeyS']) kF = -1;
            if(keys['ArrowRight'] || keys['KeyD']) kR = 1;
            if(keys['ArrowLeft'] || keys['KeyA']) kR = -1;

            // 移動計算
            const speed = 5;
            const finalF = move.forward || kF;
            const finalR = move.right || kR;
            playerBody.velocity.x = finalR * speed;
            playerBody.velocity.z = -finalF * speed;

            // 物理の位置をメッシュに反映
            if (playerMesh) {
                playerMesh.position.copy(playerBody.position);
                // めり込み対策：Blender側の原点が足元なら +0、中心なら数値を入れる
                playerMesh.position.y -= 0.5; 

                // 進行方向を向く
                if(finalF !== 0 || finalR !== 0) {
                    playerMesh.rotation.y = Math.atan2(finalR, finalF);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
