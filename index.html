<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Three.js & Cannon.js Base</title>
    <style>
        body { margin: 0; overflow: hidden; background: #aad4ff; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as CANNON from 'cannon-es';

    // --- 1. Three.js の基本設定 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaad4ff);

    // カメラ（クォータービュー風）
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 12, 12); // 斜め上遠くに配置
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // 影を有効化
    document.body.appendChild(renderer.domElement);

    // ライト
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 2. Cannon.js の物理世界設定 ---
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0); // 重力

    // 物理の床
    const floorShape = new CANNON.Plane();
    const floorBody = new CANNON.Body({ mass: 0 }); // 固定
    floorBody.addShape(floorShape);
    floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(floorBody);

    // 見ための床 (Three.js)
    const floorMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ color: 0x8bc34a })
    );
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // --- 3. モデルの読み込み ---
    const loader = new GLTFLoader();

    // キャラクターの配置
    loader.load('first_kemono_animation.glb', (gltf) => {
        const player = gltf.scene;
        player.position.set(0, 0, 0); // 中央
        player.traverse(n => { if(n.isMesh) n.castShadow = true; });
        scene.add(player);
        console.log("キャラ読み込み完了");
    });

    // 看板の配置
    loader.load('signboard.glb', (gltf) => {
        const sign = gltf.scene;
        sign.position.set(3, 0, -2); // 少し離れた場所に配置
        sign.traverse(n => { if(n.isMesh) n.castShadow = true; });
        scene.add(sign);
        console.log("看板読み込み完了");
    });

    // --- 4. アニメーションループ ---
    function animate() {
        requestAnimationFrame(animate);

        // 物理エンジンの時間を進める
        world.fixedStep();

        // 描画
        renderer.render(scene, camera);
    }
    animate();

    // リサイズ対応
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
